services:
  backend:
    build:
      context: ./backend
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-todoapp}
      DB_USER: ${DB_USER:-todoapp}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const r=require('http').get('http://127.0.0.1:3000/health',res=>{res.resume();process.exit(res.statusCode===200?0:1)});r.setTimeout(2000,()=>{r.destroy();process.exit(1)});r.on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-net
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-todoapp}
      POSTGRES_USER: ${DB_USER:-todoapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - todo-net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  todo-net:
    driver: bridge
